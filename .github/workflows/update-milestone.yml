# .github/workflows/update-milestone.yml
# A cada PR mergeado em develop, copia o trecho em quote (linhas iniciadas com ">")
# da descrição do PR para a descrição da milestone associada.
name: Atualizar descrição da milestone

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write        # milestones são editadas pela API de issues
  pull-requests: read

# Evita que dois merges simultâneos sobrescrevam a mesma milestone.
# Só PRs mergeados com milestone entram no grupo da milestone; os demais (que o job
# ignora) ficam em grupos próprios para não cancelar uma execução pendente na fila.
concurrency:
  group: ${{ github.event.pull_request.merged && github.event.pull_request.milestone && format('milestone-{0}', github.event.pull_request.milestone.number) || format('skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  update-milestone:
    if: github.event.pull_request.merged == true && github.event.pull_request.milestone != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const milestoneNumber = context.payload.pull_request.milestone.number;

            // Busca o PR atualizado (a descrição pode ter sido editada antes do merge)
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const body = pr.body || '';

            // Extrai todas as linhas em quote, removendo o "> " inicial
            const quote = body
              .split(/\r?\n/)
              .filter(l => /^\s*>/.test(l))
              .map(l => l.replace(/^\s*>\s?/, ''))
              .join('\n')
              .trim();

            if (!quote) {
              core.info(`PR #${prNumber} não possui trecho em quote. Nada a fazer.`);
              return;
            }

            const { data: milestone } = await github.rest.issues.getMilestone({
              owner, repo, milestone_number: milestoneNumber,
            });
            const current = milestone.description || '';

            // Marcador para não duplicar caso o workflow rode de novo
            const marker = `<!-- pr:${prNumber} -->`;
            if (current.includes(marker)) {
              core.info(`PR #${prNumber} já registrado na milestone "${milestone.title}".`);
              return;
            }

            const entry = `${marker}\n**#${prNumber} – ${pr.title}**\n${quote}`;
            const description = current.trim() ? `${current.trim()}\n\n${entry}` : entry;

            await github.rest.issues.updateMilestone({
              owner, repo, milestone_number: milestoneNumber, description,
            });

            core.info(`Milestone "${milestone.title}" atualizada com o PR #${prNumber}.`);
